default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  # Lets two services share one PostgreSQL database, each in its own schema
  # (Render's free plan allows one database per workspace).
  schema_search_path: <%= ENV.fetch("DB_SCHEMA", "public") %>
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://localhost/meeting_development") %>

development:
  <<: *default

test:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://localhost/meeting_test") %>

production:
  <<: *default

