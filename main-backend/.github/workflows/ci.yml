# Runs when this folder is the root of a GitHub repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: backend
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: roots18_backend_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backend -d roots18_backend_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:8.1.11-alpine
        ports: ["6379:6379"]
    env:
      RAILS_ENV: test
      CI: "true"
      DATABASE_URL: postgresql://backend:ci-only-password@localhost:5432/roots18_backend_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Prepare the test database
        run: bin/rails db:prepare
      - name: Run the tests
        run: bundle exec rspec

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image from the lockfile
        run: docker build --tag main-backend:ci .
