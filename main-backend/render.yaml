# To deploy the meeting service and the main backend together, use
# render-deploy/render.yaml instead (see render-deploy/DEPLOY-GITHUB.md, or
# DEPLOY.md for the Docker Hub way without GitHub): a free Render
# workspace allows only one database, so the two must share it.
#
# The main backend on Render: web service (Puma and Sidekiq together on the free
# plan), PostgreSQL and Key Value (Valkey). Not deployed yet; values marked
# sync: false are asked for when the Blueprint is created.
services:
  - type: web
    name: roots18-main-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh bin/render-start
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roots18-backend-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: roots18-backend-queue
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: MEETING_SERVICE_URL
        sync: false
      - key: MEETING_EVENTS_SECRET
        sync: false
      - key: PAYMENT_PROVIDER
        value: demo
      # Test server only: remove both pairs before real patients use it.
      - key: DEMO_PAYMENTS
        value: "true"
      - key: ALLOW_DEMO_PAYMENTS_IN_PRODUCTION
        value: "true"
      - key: OTP_FIXED_CODE
        value: "123456"
      - key: ALLOW_TEST_LOGIN_IN_PRODUCTION
        value: "true"
      - key: FORCE_SSL
        value: "true"
      - key: ASSUME_SSL
        value: "true"
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"

  - type: keyvalue
    name: roots18-backend-queue
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: roots18-backend-db
    plan: free
    region: singapore
    ipAllowList: []
